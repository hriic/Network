name: Assemble Packet Tracer project

on:
  push:
    paths:
      - ".pkt-upload/**"
      - ".github/workflows/assemble-packet-tracer.yml"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct and verify Packet Tracer file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Task-1-Basic-Switch-and-End-Device-Configuration
          cat .pkt-upload/part-*.b64 | tr -d '\r\n' | base64 --decode > Task-1-Basic-Switch-and-End-Device-Configuration/Task1_Basic_Switch_Configuration.pkt
          actual_size="$(wc -c < Task-1-Basic-Switch-and-End-Device-Configuration/Task1_Basic_Switch_Configuration.pkt | tr -d ' ')"
          actual_sha="$(git hash-object Task-1-Basic-Switch-and-End-Device-Configuration/Task1_Basic_Switch_Configuration.pkt)"
          test "$actual_size" = "53100"
          test "$actual_sha" = "4be8245c7b6bd4e6f4b2d131f492f6ec846598fc"

      - name: Commit the simulation and remove temporary upload chunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Task-1-Basic-Switch-and-End-Device-Configuration/Task1_Basic_Switch_Configuration.pkt
          git rm -r .pkt-upload
          git commit -m "Add Task 1 Packet Tracer simulation"
          git push origin HEAD:main
